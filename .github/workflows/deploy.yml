name: Deploy

# Deploys the web app to Cloudflare Workers via OpenNext on pushes to main.
# Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts + D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID  — the target account id
# Until those are set this workflow is skipped (see the `if` guard).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_DEPLOY == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build skateAF design system
        run: pnpm --filter skateaf run build

      - name: Apply D1 migrations (remote)
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply skateboardordie-waitlist --remote

      - name: Build & deploy web app
        run: pnpm --filter web run deploy
